
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <header>
            <h1>Student Result Management System</h1>
            <p>Enter student details and academic marks</p>
        </header>

        <!-- Student Information -->
        <section class="card" id="studentSection">

            <h2>Student Information</h2>

            <div class="form-row">

                <div class="input-box">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                    >
                </div>

                <div class="input-box">
                    <label for="roll">Roll Number</label>
                    <input
                        type="text"
                        id="roll"
                        placeholder="Enter roll number"
                    >
                </div>

            </div>

            <button class="primary-btn" onclick="showMarksSection()">
                Continue
            </button>

        </section>


        <!-- Marks Section -->
        <section class="card hidden" id="marksSection">

            <h2>Enter Subject Marks</h2>

            <div class="marks-grid">

                <div class="input-box">
                    <label for="m1">Subject 1</label>
                    <input type="number" id="m1" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label for="m2">Subject 2</label>
                    <input type="number" id="m2" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label for="m3">Subject 3</label>
                    <input type="number" id="m3" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label for="m4">Subject 4</label>
                    <input type="number" id="m4" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label for="m5">Subject 5</label>
                    <input type="number" id="m5" min="0" max="100" placeholder="0 - 100">
                </div>

            </div>

            <button class="success-btn" onclick="addStudent()">
                Add Student Result
            </button>

        </section>


        <!-- Topper -->
        <div class="topper-card" id="topper">
            Topper : None
        </div>


        <!-- Results -->
        <section class="result-section">

            <h2>Student Results</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Total</th>
                            <th>Percentage</th>
                            <th>Grade</th>
                            <th>Result</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="tableBody">
                        <!-- Results will be added using JavaScript -->
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
