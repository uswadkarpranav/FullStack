
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Registration System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Employee Registration</h1>
            <p>Enter employee details below</p>
        </div>

        <form id="employeeForm">

            <div class="row">

                <div class="input-group">
                    <label>Employee ID</label>
                    <input type="number" id="employeeId"
                           placeholder="Enter employee ID" required>
                </div>

                <div class="input-group">
                    <label>Employee Name</label>
                    <input type="text" id="name"
                           placeholder="Enter full name" required>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email"
                           placeholder="example@gmail.com" required>
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="10-digit mobile number"
                           pattern="[0-9]{10}" required>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Department</label>

                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">Human Resources</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Designation</label>
                    <input type="text" id="designation"
                           placeholder="e.g. Software Developer" required>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Salary</label>
                    <input type="number" id="salary"
                           placeholder="Enter salary" min="0" required>
                </div>

                <div class="input-group">
                    <label>Date of Joining</label>
                    <input type="date" id="joiningDate" required>
                </div>

            </div>

            <button type="submit">Register Employee</button>

        </form>

        <div id="message"></div>

        <div class="employee-list">

            <h2>Registered Employees</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Salary</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                </tbody>
            </table>

        </div>

    </div>


    <script>

        const form = document.getElementById("employeeForm");
        const table = document.getElementById("employeeTable");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const employeeId =
                document.getElementById("employeeId").value;

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const phone =
                document.getElementById("phone").value;

            const department =
                document.getElementById("department").value;

            const designation =
                document.getElementById("designation").value;

            const salary =
                document.getElementById("salary").value;

            const joiningDate =
                document.getElementById("joiningDate").value;


            // Check for duplicate employee ID

            const existingEmployees =
                JSON.parse(localStorage.getItem("employees")) || [];

            const duplicate =
                existingEmployees.some(
                    emp => emp.employeeId === employeeId
                );

            if (duplicate) {

                message.innerHTML =
                    "Employee ID already exists!";

                message.className = "error";

                return;
            }


            // Create employee object

            const employee = {

                employeeId: employeeId,
                name: name,
                email: email,
                phone: phone,
                department: department,
                designation: designation,
                salary: salary,
                joiningDate: joiningDate

            };


            // Save employee

            existingEmployees.push(employee);

            localStorage.setItem(
                "employees",
                JSON.stringify(existingEmployees)
            );


            message.innerHTML =
                "✓ Employee registered successfully!";

            message.className = "success";


            form.reset();

            displayEmployees();

        });


        // Display employees in table

        function displayEmployees() {

            const employees =
                JSON.parse(localStorage.getItem("employees")) || [];

            table.innerHTML = "";

            employees.forEach(function(employee) {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${employee.employeeId}</td>
                    <td>${employee.name}</td>
                    <td>${employee.department}</td>
                    <td>${employee.designation}</td>
                    <td>₹${employee.salary}</td>
                `;

                table.appendChild(row);

            });

        }


        // Load saved employees when page opens

        displayEmployees();


    </script>
<script src="script.js"></script>
</body>
</html>
