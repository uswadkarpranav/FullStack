<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Travel Website</title>

    <style>
        .hero{
            height:90vh;
            background:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e") center/cover no-repeat;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TravelX</a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Destinations</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Packages</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                </ul>

                <button class="btn btn-warning ms-3">
                    Book Now
                </button>

            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero d-flex justify-content-center align-items-center text-center">

        <div class="text-white">

            <h1 class="display-3 fw-bold">
                Explore The World
            </h1>

            <p class="lead">
                Discover amazing places at exclusive deals.
            </p>

            <button class="btn btn-primary btn-lg">
                Start Journey
            </button>

        </div>

    </section>

    <!-- Popular Destinations -->
    <div class="container my-5">

        <h2 class="text-center mb-4">
            Popular Destinations
        </h2>

        <div class="row">

            <div class="col-md-4">

                <div class="card">

                    <img src="https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86" class="card-img-top">

                    <div class="card-body">

                        <h5 class="card-title">
                            Goa
                        </h5>

                        <p class="card-text">
                            3 Days / ₹8,999
                        </p>

                        <a href="#" class="btn btn-success">
                            Book
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" class="card-img-top">

                    <div class="card-body">

                        <h5 class="card-title">
                            Manali
                        </h5>

                        <p class="card-text">
                            5 Days / ₹12,999
                        </p>

                        <a href="#" class="btn btn-success">
                            Book
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e" class="card-img-top">

                    <div class="card-body">

                        <h5 class="card-title">
                            Kashmir
                        </h5>

                        <p class="card-text">
                            7 Days / ₹18,999
                        </p>

                        <a href="#" class="btn btn-success">
                            Book
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Contact -->
    <div class="container my-5">

        <h2 class="text-center mb-4">
            Contact Us
        </h2>

        <form>

            <input type="text"
            class="form-control mb-3"
            placeholder="Your Name">

            <input type="email"
            class="form-control mb-3"
            placeholder="Email">

            <textarea
            class="form-control mb-3"
            rows="5"
            placeholder="Message"></textarea>

            <button class="btn btn-primary">
                Send
            </button>

        </form>

    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">

        © 2026 TravelX | All Rights Reserved

    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
